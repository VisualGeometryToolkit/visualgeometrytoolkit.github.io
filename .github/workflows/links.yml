# Dead-link check (lychee) over the hand-written landing page and the README.
# The job is the stack's reusable workflow (the monorepo's StackLinks.yml, the
# same every stack repository calls: the stack's settings and exclusions are
# there, this repository's exclusion below). Runs on PRs, pushes to main,
# weekly (links rot without a commit), and by hand.
name: Links
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lychee:
    uses: VisualGeometryToolkit/VisualGeometryToolkit.jl/.github/workflows/StackLinks.yml@workflows/v1
    with:
      paths: index.html README.md
      timeout-minutes: 10
      # CI status badges (GitHub renders them; anonymous fetches can be slow or 404
      # before the first run on a branch).
      exclude: |
        ^https://github\.com/VisualGeometryToolkit/[^/]+/actions/workflows/[^/]+/badge\.svg
