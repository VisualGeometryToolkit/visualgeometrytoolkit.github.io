# lychee configuration for the Links workflow (.github/workflows/links.yml).
# Run locally from the repository root with the same inputs:
#   lychee --config .lychee.toml index.html README.md

# Retries and timeouts: patient with slow hosts, polite to all of them.
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 16

# 429 is rate limiting, never a dead link. doi.org and the publisher sites it
# redirects to (IEEE, ACM, Springer, Elsevier, Wiley) answer 403 to anonymous
# clients such as CI runners. lychee has no per-host accept list, so both are
# accepted for every host; a dead link still shows as 404/410 or a DNS error.
accept = ["200..=299", "403", "429"]

# Skip links to localhost and private networks (the README's preview server).
exclude_all_private = true

# Mail addresses are not checked.
include_mail = false

# The landing page links the package docs relatively (`VisualGeometryToolkitCore/`).
# Those directories are not in this repository: the Portal workflow builds them
# into the published site, so check them there.
remap = [
  '^file://.*/((VisualGeometryToolkit[A-Za-z]+|PoseLib)/?)$ https://visualgeometrytoolkit.github.io/$1',
]

exclude = [
  '^mailto:',
  '^https?://(localhost|127\.0\.0\.1)',
  # Per-package release docs exist only once a package is tagged, after its
  # General registration (TagBot then deploys /<Package>/stable/). Expected 404s
  # until then: remove this exclusion once every package has a tagged release.
  '^https://visualgeometrytoolkit\.github\.io/VisualGeometryToolkit[A-Za-z]+/stable',
  # Codecov badges and app pages 404 for anonymous clients or time out.
  '^https://(app\.)?codecov\.io/',
  # CI status badges (GitHub renders them; anonymous fetches can be slow or 404
  # before the first run on a branch).
  '^https://github\.com/VisualGeometryToolkit/[^/]+/actions/workflows/[^/]+/badge\.svg',
]

# doi.org rate-limits bursts; one request at a time, spaced out.
[hosts."doi.org"]
concurrency = 1
request_interval = "1s"
